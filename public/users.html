<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المستخدمون · IAM Gateway</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="users" data-permission="users:read">
<main class="main" id="main" hidden>
  <div class="page-head">
    <div><div class="crumb">إدارة الهوية والوصول</div><h1>المستخدمون ودورة حياة الحساب</h1><p>الإنشاء، الموافقة، تغيير الأدوار، التعليق، والإيقاف النهائي (Joiner – Mover – Leaver).</p></div>
    <div class="actions" id="headActions"></div>
  </div>
  <div class="card">
    <div class="toolbar">
      <input type="search" id="q" placeholder="بحث بالاسم أو اسم المستخدم أو البريد">
      <select id="fStatus"><option value="">كل الحالات</option><option value="pending">بانتظار الموافقة</option><option value="active">نشط</option><option value="suspended">معلّق</option><option value="disabled">معطّل</option></select>
      <select id="fRole"><option value="">كل الأدوار</option></select>
      <select id="fDept"><option value="">كل الأقسام</option></select>
      <span class="spacer"></span><span class="muted" id="count"></span>
    </div>
    <div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>القسم والمسمى</th><th>الأدوار</th><th>الحالة</th><th>MFA</th><th>آخر دخول</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
